services:
  eazio:
    build: .
    image: eazio:latest
    container_name: eazio
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/eazio.db
      # COOKIE_SECURE is driven by .env (server-only). Default in env.ts is true;
      # set COOKIE_SECURE=false in .env where the client can't keep a Secure cookie
      # (e.g. TLS-intercepting networks that make the browser distrust the connection).
    ports:
      # Nginx Proxy Manager forwards a domain to http://<host-ip>:${EAZIO_PORT}.
      # Host-port keeps it robust regardless of which docker network NPM runs on
      # (NPM here is on the default bridge, which has no name resolution).
      - "${EAZIO_PORT:-8413}:3000"
    volumes:
      - eazio-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  eazio-data:
